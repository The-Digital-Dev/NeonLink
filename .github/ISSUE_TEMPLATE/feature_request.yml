name: Feature or theme idea
description: Suggest a new setting, platform, theme or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could NeonLink support it?
      description: For settings, suggest a variable name and default. Remember every visible word is configuration.
  - type: checkboxes
    id: compat
    attributes:
      label: Compatibility
      options:
        - label: This keeps existing littlelink-server variables working.
