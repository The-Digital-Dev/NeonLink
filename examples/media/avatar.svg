<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Illustrated avatar of Alex Rivera, an invented sample person</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/><stop offset=".55" stop-color="#0b1f4a"/><stop offset="1" stop-color="#062b3a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b48f"/><stop offset="1" stop-color="#c98d68"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f6b"/><stop offset="1" stop-color="#14163a"/>
    </linearGradient>
    <clipPath id="c"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g stroke="#00f0ff" stroke-opacity=".10" stroke-width="2">
      <path d="M0 384h512M0 416h512M0 448h512M0 480h512"/>
      <path d="M64 512L192 352M448 512L320 352M256 512V352"/>
    </g>
    <circle cx="256" cy="236" r="178" fill="none" stroke="url(#rim)" stroke-width="6" stroke-opacity=".85"/>
    <!-- shoulders and jacket -->
    <path d="M86 512c8-92 72-148 170-148s162 56 170 148z" fill="url(#jacket)"/>
    <path d="M214 368l42 58 42-58" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M150 420l-14 92M362 420l14 92" stroke="#ff2bd6" stroke-opacity=".6" stroke-width="4"/>
    <!-- neck -->
    <path d="M226 318h60v58c0 14-60 14-60 0z" fill="#b97f5c"/>
    <!-- head -->
    <ellipse cx="256" cy="236" rx="78" ry="94" fill="url(#skin)"/>
    <ellipse cx="178" cy="246" rx="12" ry="20" fill="#c98d68"/>
    <ellipse cx="334" cy="246" rx="12" ry="20" fill="#c98d68"/>
    <!-- hair: short, swept -->
    <path d="M176 222c-6-74 40-112 92-112 50 0 92 30 86 106-14-34-44-52-86-52-30 10-60 22-92 58z" fill="#2a1a2e"/>
    <path d="M226 128c34-16 86-10 110 26-32-14-70-16-110-26z" fill="#ff2bd6" fill-opacity=".55"/>
    <!-- visor glasses -->
    <rect x="196" y="222" width="120" height="34" rx="12" fill="#0b0d22" stroke="#00f0ff" stroke-width="4"/>
    <path d="M206 236h100" stroke="#00f0ff" stroke-opacity=".55" stroke-width="3"/>
    <!-- simple smile -->
    <path d="M232 292c14 12 34 12 48 0" fill="none" stroke="#7a4a36" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
